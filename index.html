function normalizeSettings(st){
  if(!st||typeof st!='object'||Array.isArray(st))return null;
  const b=DEF(),o={...b};
  ['tab','plan','tokun','talent','star','beam','rental','useMan','manName','manPlan','sel','spExact','spec','schTab'].forEach(k=>{if(st[k]!==undefined)o[k]=st[k]});
  if(st.manInit&&typeof st.manInit=='object')o.manInit=[0,1,2].map(i=>+st.manInit[i]||0);
  if(st.manPb&&typeof st.manPb=='object')o.manPb=[0,1,2].map(i=>+st.manPb[i]||0);
  if(Array.isArray(st.mem)&&st.mem.length==4)o.mem=st.mem.map(r=>Array.isArray(r)?[0,1,2].map(i=>+r[i]||0):[7,7,7]);

  if(st.cnt&&typeof st.cnt=='object')o.cnt={...b.cnt,...st.cnt};
  if(Array.isArray(st.sch)&&st.sch.length==26&&st.sch.every(d=>d&&typeof d.a=='string'))o.sch=st.sch;
  const ids=new Set(DATA.cards.map(c=>c.id));
  o.fixed=Array.isArray(st.fixed)?st.fixed.filter(id=>ids.has(id)):[];
  o.excl=Array.isArray(st.excl)?st.excl.filter(id=>ids.has(id)):[];

 $('s4b').innerHTML=`<div class=line><span class=lbl>一括設定</span><select id=owBulk>${[['','未所持'],['0','0凸'],['1','1凸'],['2','2凸'],['3','3凸'],['4','4凸']].map(([val,lab])=>`<option value="${val}"${owBulk==val?' selected':''}>${lab}</option>`).join('')}</select><button id=owBulkGo class=ghost>表示中のカードに反映</button></div><div class=line><input id=owQ type=search placeholder="カード名で検索" value="${owQ}"><select id=owR>${[['','レア度'],['R','R'],['Sr','SR'],['Ssr','SSR']].map(([val,lab])=>`<option value="${val}"${owR==val?' selected':''}>${lab}</option>`).join('')}</select><select id=owA>${[[-1,'属性'],[0,'Vo'],[1,'Da'],[2,'Vi'],[3,'アシスト']].map(([val,lab])=>`<option value="${val}"${owA==val?' selected':''}>${lab}</option>`).join('')}</select><select id=owP>${[[-1,'プラン'],[0,'フリー'],[1,'センス'],[2,'ロジック'],[3,'アノマリー']].map(([val,lab])=>`<option value="${val}"${owP==val?' selected':''}>${lab}</option>`).join('')}</select></div><div id=owList></div><small>能力値は所持状況の凸数で変わります（未所持のカードは4凸として計算します）。</small>`;
 renderOwned();
 $('s4c').innerHTML=`<div class=line><input id=feQ type=search placeholder="カード名で検索" value="${feQ}"><select id=feR>${[['','レア度'],['R','R'],['Sr','SR'],['Ssr','SSR']].map(([val,lab])=>`<option value="${val}"${feR==val?' selected':''}>${lab}</option>`).join('')}</select><select id=feA>${[[-1,'属性'],[0,'Vo'],[1,'Da'],[2,'Vi'],[3,'アシスト']].map(([val,lab])=>`<option value="${val}"${feA==val?' selected':''}>${lab}</option>`).join('')}</select><select id=feP>${[[-1,'プラン'],[0,'フリー'],[1,'センス'],[2,'ロジック'],[3,'アノマリー']].map(([val,lab])=>`<option value="${val}"${feP==val?' selected':''}>${lab}</option>`).join('')}</select><button id=clearFE class=ghost style="margin-left:auto">固定・除外を解除</button></div><div id=feList></div><small>所持登録されているサポカのみ表示しています。凸数は所持サポカ登録の内容を反映します。</small>`;
 renderFE();renderSave();}
function cur(){return tops[S.sel]?tops[S.sel].cs:[]}
function out(){
 const cw=$('cntwarn');if(cw){const C=S.cnt||{},acq=(C.get||0)+(C.exch||0),ws=[];GFU.filter(([, ,pl])=>!pl||pl===S.plan).forEach(([k,n])=>{if((C[k]||0)>acq)ws.push(n+'が合計（'+acq+'）を超えています')});if((C.upMen||0)>(C.up||0))ws.push('うち メンタル強化が合計を超えています');if((C.upAct||0)>(C.up||0))ws.push('うち アクティブ強化が合計を超えています');if((C.deMen||0)>(C.de||0))ws.push('うち メンタル削除が合計を超えています');if((C.deAct||0)>(C.de||0))ws.push('うち アクティブ削除が合計を超えています');cw.textContent=ws.length?'警告: '+ws.join('／')+'（合計の回数に切り捨てて計算します）':''}
showTop()}
function showTop(){const e=$('tops');if(!e)return;if(!tops.length){e.innerHTML='<p class=hint>まだ探索結果がありません。「編成を探索」または「固定6枚で計算」を押してください。</p>';return}
const fmtD=d=>[0,1,2].map(a=>`<span class='${['vo','da','vi'][a]}'>${AT[a]}${d[a]>=0?'+':''}${d[a]}</span>`).join(' ');
e.innerHTML=`<h3>探索結果（上位${tops.length}件）</h3><div class=topgrid>${tops.map((x,i)=>{const cs=x.cs,det=[];const full=sim(S,cs,det,tmpFire),open=i==S.sel;return`<details class=topcard${open?' open':''}><summary data-r="${i}"><span>${i+1}位</span> <span class=ev>${x.v}</span> <span class=lbl>パラ合計 ${full.par}</span></summary>${open?`<div class=score><span class=num>${full.tot}</span><span class=pill>${grade(full.tot)[1]}</span></div><div class=stats>${[0,1,2].map(i=>`<div class=st><div class='k ${['vo','da','vi'][i]}'>${AT[i]}</div><div class='v ${['vo','da','vi'][i]}'>${full.p[i]}</div></div>`).join('')}<div class=st><div class=k>合計</div><div class=v>${full.par}</div></div><div class=st><div class=k>スター性</div><div class=v>${full.star}<span class=lbl> /1335</span></div></div></div><div class=tgrid>${cs.map((c,ci)=>{const wo=sim(S,cs.filter(y=>y!=c),null,tmpFire),d=[0,1,2].map(a=>full.p[a]-wo.p[a]),tot=d[0]+d[1]+d[2],ab=(det[ci]||{ab:[],direct:[0,0,0]}).ab,dir=det[ci].direct,bG=(c.eff.B&&c.eff.B.length)?(()=>{const m=cs.slice();m[ci]={...c,eff:{...c.eff,B:[]},effLb:c.effLb?c.effLb.map(f=>({...f,B:[]})):undefined};const nb=sim(S,m,null,tmpFire);return[0,1,2].map(a=>full.p[a]-nb.p[a])})():[0,0,0],res=[0,1,2].map(a=>d[a]-dir[a]-bG[a]);return`<div class=trow><div class=tn>${cimg(c)}${c.n}${c.sp?'<span class=sptag>SP</span>':''} <span class=lbl>${RU(c.r)} ${AT[c.t]||'アシスト'} ${(S.owned[c.id]!=null?S.owned[c.id]:4)}凸</span></div><div class=tc>寄与 ${tot>=0?'+':''}${tot}（${fmtD(d)}）</div>${ab.length?ab.map(y=>y.pct?`<div class=ab>${trigLabel(y.tr)}：<span class='${['vo','da','vi'][y.a]}'>${AT[y.a]}+${y.v}%</span>（${bG[y.a]>=0?'+':''}${bG[y.a]}）</div>`:((y.tr=='I'||y.tr=='EV')?`<div class=ab>${trigLabel(y.tr)}：<span class='${['vo','da','vi'][y.a]}'>${AT[y.a]}+${y.tot}</span>${y.n>1?`（${y.v}×${y.n}回）`:''}</div>`:`<div class=ab>${trigLabel(y.tr)}：<span class='${['vo','da','vi'][y.a]}'>${AT[y.a]}+${y.tot}</span>（${y.v}×<input type=number class=tmpf data-tf="${c.id}|${y.tr}|${y.idx}" value="${tmpFire[c.id+'|'+y.tr+'|'+y.idx]!=null?tmpFire[c.id+'|'+y.tr+'|'+y.idx]:y.n}" min=0>回）</div>`)).join(''):''}${res.some(v=>v!=0)?`<div class=ab>間接分：${fmtD(res)}</div>`:''}${!ab.length&&tot==0?`<div class=ab>この条件ではステータス上昇なし</div>`:''}</div>`}).join('')}</div>`:`<div class=tgrid></div>`}${open?`<div class=line><button data-recalc="${i}">現在の入力で再計算</button><button class=ghost data-regfix="${i}">結果の6枚を固定に登録</button></div>`:`<div class=line><button class=ghost data-regfix="${i}">結果の6枚を固定に登録</button></div>`}</details>`}).join('')}</div><p class=hint style="margin-top:8px">開いている編成の評価値・ステータスをカードの上に表示しています。寄与は「そのカードを外したときのパラメータ合計の減少分」をステータス換算したもので、Vo/Da/Vi別の内訳も表示しています。アビリティ別の上昇量は実際に発動した分のみで、パラメータボーナスは％表示の横に（）で実際の上昇量も表示しています。間接分（上限3000/3200・Pアイテム獲得数など、他カードと共有する条件による差分）は別行に表示しています。各アビリティ・Pアイテムの発動回数は臨時で変更でき、「現在の入力で再計算」を押すとその回数で再計算します（臨時の回数は次に編成探索を行うと忘れます）。</p>`}
document.addEventListener('input',ev=>{const t=ev.target,k=t.dataset.k;let rb=0;
 if(t.classList&&t.classList.contains('tmpf')){const tf=t.dataset.tf,v=+t.value;if(isNaN(v)||v<0)delete tmpFire[tf];else tmpFire[tf]=Math.floor(v);return}
 if(t.id=='owQ'){owQ=t.value;renderOwned();return}
 if(t.id=='feQ'){feQ=t.value;feN=20;renderFE();return}
 if(t.id=='svON'){svON=t.value;return}
 if(t.id=='svSN'){svSN=t.value;return}
 if(t.id=='bulkLm'){bLm=+t.value;t.className=['vo','da','vi'][bLm]||''}if(t.id=='bulkLs'){bLs=+t.value;t.className=['vo','da','vi'][bLs]||''}if(t.id=='bulkLsp')bLsp=t.value;if(t.id=='bulkKm'){bKm=+t.value;t.className=['vo','da','vi'][bKm]||''}
 if(k){const v=t.type=='checkbox'?(t.checked?1:0):t.type=='number'?+t.value:(isNaN(t.value)||t.value===''?t.value:+t.value);sp(k,v);if(k=='plan'){tops=[];tmpFire={};rb=1}if(k=='rental')rb=1;if(/^spMin\./.test(k)||k=='spExact')rb=1;if(k=='tokun'||k=='talent')rb=3;if(/^mem\./.test(k))rb=3;if(k=='useMan'){if(v==1){const B=baseStats(S);S.manInit=[...B.init];S.manPb=[...B.pb];S.manPlan=B.d.p;S.manName=B.d.n;S.plan=B.d.p}else{S.plan=baseStats(S).d.p}tops=[];tmpFire={};rb=3}if(k=='manPlan'){S.plan=v;tops=[];tmpFire={};rb=3}if(/^sch\.\d+\.a$/.test(k))rb=2;if(/^sch\.\d+\.m$/.test(k)){const ii=+k.split('.')[1];if(S.sch[ii].s==S.sch[ii].m)S.sch[ii].s=(S.sch[ii].m+1)%3;rb=2}}

 if(t.id=='chara'){const cs2=DATA.idols.filter(x=>x.cn==t.value);S.iid=(cs2.find(x=>x.id==S.iid)||cs2[0]).id;S.plan=idolStats(S).d.p;tops=[];tmpFire={};build();}else if(t.id=='idol'){S.iid=t.value;S.plan=idolStats(S).d.p;tops=[];tmpFire={};build();}else if(rb==3){build()}else if(rb==2){const y=scrollY;build();scrollTo(0,y)}else if(rb==1){build5()}
 save();out()});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id=='owBulk'){owBulk=t.value;return}if(t.id=='owR'){owR=t.value;renderOwned();return}if(t.id=='owA'){owA=+t.value;renderOwned();return}if(t.id=='owP'){owP=+t.value;renderOwned();return}if(t.id=='feR'){feR=t.value;feN=20;renderFE();return}if(t.id=='feA'){feA=+t.value;feN=20;renderFE();return}if(t.id=='feP'){feP=+t.value;feN=20;renderFE();return}if(t.dataset.ow){const v=t.value;if(v==='')delete S.owned[t.dataset.ow];else S.owned[t.dataset.ow]=+v;$('owH').textContent='所持サポカ登録（'+Object.keys(S.owned).length+'枚）';save();out();return}if(t.id=='impOwnedFile'||t.id=='impSetFile'){const f=t.files&&t.files[0];if(!f)return;const kind=t.id=='impOwnedFile'?'owned':'settings';const rd=new FileReader();rd.onload=()=>{const err=applyImport(String(rd.result),kind);svMsg=err||('ファイルから'+(kind=='owned'?'所持サポカ登録':'その他の設定')+'を読み込みました');if(!err){save();build();out()}renderSave()};rd.onerror=()=>{svMsg='ファイルの読み込みに失敗しました';renderSave()};rd.readAsText(f);t.value='';return}
if(t.dataset.k&&/^(plan|rental)$/.test(t.dataset.k)){build5();out()}});
document.addEventListener('click',async ev=>{const t=ev.target,r=t.closest&&t.closest('[data-r]');if(r){S.sel=+r.dataset.r;showTop();out();return}
 if(t.dataset&&t.dataset.mtab){S.tab=t.dataset.mtab;const y=scrollY;build();scrollTo(0,y);save();out();return}
 if(t.dataset&&t.dataset.tab){S.schTab=t.dataset.tab;const y=scrollY;build();scrollTo(0,y);save();out();return}
 if(t.id=='bulkL'){const m=+$('bulkLm').value;let s=+$('bulkLs').value;if(s==m)s=(m+1)%3;const sp=$('bulkLsp').value;bLm=m;bLs=s;bLsp=sp;S.sch.forEach(d=>{if(d.a=='L'){d.m=m;d.s=s;d.sp=sp}});build();out();save();return}
 if(t.id=='bulkK'){const m=+$('bulkKm').value;bKm=m;S.sch.forEach(d=>{if(d.a=='K')d.m=m});build();out();save();return}
 if(t.id=='rst'){localStorage.removeItem(K);localStorage.removeItem(OK);S=DEF();tops=[];tmpFire={};build();out()}
 if(t.id=='applyDist1'){S.dist[1]=[...S.dist[0]];S.dist[2]=[...S.dist[0]];build();out()}
 if(t.dataset.fix){const id=t.dataset.fix;S.fixed=S.fixed||[];const i=S.fixed.indexOf(id);if(i>=0)S.fixed.splice(i,1);else{if(S.fixed.length>=6){barMsg('固定は6枚までです');return}S.fixed.push(id);S.excl=(S.excl||[]).filter(x=>x!=id)}build5();save();out();return}
 if(t.dataset.exc){const id=t.dataset.exc;S.excl=S.excl||[];const i=S.excl.indexOf(id);if(i>=0)S.excl.splice(i,1);else{S.excl.push(id);S.fixed=(S.fixed||[]).filter(x=>x!=id)}build5();save();out();return}
 if(t.dataset.unfix){S.fixed=(S.fixed||[]).filter(x=>x!=t.dataset.unfix);build5();save();out();return}
 if(t.id=='clearFE'){S.fixed=[];S.excl=[];build5();save();out();return}
 if(t.id=='feMore'){feN+=20;renderFE();return}
 if(t.id=='owBulkGo'){const v=owBulk;ownedList().forEach(c=>{if(v==='')delete S.owned[c.id];else S.owned[c.id]=+v});renderOwned();save();out();return}
 if(t.dataset&&t.dataset.regfix!=null){const x=tops[+t.dataset.regfix];if(!x||x.cs.length<6){barMsg('6枚の編成がありません。まず「編成を探索」してください。');return}S.fixed=x.cs.map(c=>c.id);build5();save();out();barMsg('結果の'+(+t.dataset.regfix+1)+'位の6枚を固定に登録しました。');return}
 if(t.dataset&&t.dataset.recalc!=null){document.querySelectorAll('#tops .tmpf').forEach(inp=>{const k=inp.dataset.tf,v=+inp.value;if(isNaN(v)||v<0)delete tmpFire[k];else tmpFire[k]=Math.floor(v)});out();return}
 if(t.id=='goBar'){const res=await runSearch(x=>barMsg('探索中 '+Math.round(x*100)+'%'));if(res&&res.length){barMsg('探索が完了しました。');S.tab='res';build();out()}else if(res){barMsg('条件を満たす編成がありません。SP率の条件をゆるめてください。')}else barMsg('探索を中断しました。');return}
 if(t.id=='calcFix'){const fx=S.fixed||[];if(fx.length<6){barMsg('固定が6枚未満です（現在'+fx.length+'枚）。「サポートを探す・固定・除外」から6枚固定してください。');return}const cs=fx.map(id=>DATA.cards.find(c=>c.id==id)).filter(Boolean);tmpFire={};tops=[{cs,v:sim(S,cs).v}];S.sel=0;S.tab='res';build();out();return}
 if(t.id=='svOwnedGo'){const err=saveNamed('owned',svON);svMsg=err||('所持サポカ登録を「'+svON+'」としてブラウザに保存しました');renderSave();return}
 if(t.id=='svSetGo'){const err=saveNamed('settings',svSN);svMsg=err||('その他の設定を「'+svSN+'」としてブラウザに保存しました');renderSave();return}
 if(t.id=='expOwned'){const x=exportJSON('owned',svON);const err=downloadFile(x.file,x.text);svMsg=err||('所持サポカ登録をファイルに書き出しました（'+x.file+'）');renderSave();return}
 if(t.id=='expSet'){const x=exportJSON('settings',svSN);const err=downloadFile(x.file,x.text);svMsg=err||('その他の設定をファイルに書き出しました（'+x.file+'）');renderSave();return}
 if(t.id=='impOwned'){const f=$('impOwnedFile');if(f)f.click();return}
 if(t.id=='impSet'){const f=$('impSetFile');if(f)f.click();return}
 if(t.dataset&&t.dataset.loadOwned){const err=loadNamed('owned',t.dataset.loadOwned);svMsg=err||('所持サポカ登録「'+t.dataset.loadOwned+'」を読み込みました');if(!err){save();build5();out()}renderSave();return}
 if(t.dataset&&t.dataset.loadSettings){const err=loadNamed('settings',t.dataset.loadSettings);svMsg=err||('その他の設定「'+t.dataset.loadSettings+'」を読み込みました');if(!err){save();build();out()}renderSave();return}
 if(t.dataset&&t.dataset.delOwned){deleteNamed('owned',t.dataset.delOwned);svMsg='所持サポカ登録「'+t.dataset.delOwned+'」を削除しました';renderSave();return}
 if(t.dataset&&t.dataset.delSettings){deleteNamed('settings',t.dataset.delSettings);svMsg='その他の設定「'+t.dataset.delSettings+'」を削除しました';renderSave();return}});
build();out();
</script><div id=bar><div class=barin><button id=goBar>編成を探索</button><button id=calcFix class=ghost>固定6枚で計算</button><span id=barMsg>設定を確認し「編成を探索」を押してください。</span></div></div></body></html>
