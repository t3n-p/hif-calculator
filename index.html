<style>:root{--bg:#f6f6f7;--sf:#fff;--sub:#f4f4f5;--bd:#e4e4e7;--fg:#18181b;--mu:#71717a;--ink:#18181b;--onink:#fff;--ring:#2563eb;--vo:#d9363e;--da:#2563eb;--vi:#eab308;--as:#16a34a;--dg:#d33}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
body{margin:0 auto;max-width:1100px;padding:0 16px 120px;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:12px;padding:20px 0 4px}.htitle{flex:1;min-width:0}h1{font-size:20px;font-weight:650;margin:0;letter-spacing:.01em}header p{margin:2px 0 0;font-size:12px;color:var(--mu)}

h2{font-size:13px;font-weight:600;color:var(--mu);letter-spacing:.06em;margin:24px 0 8px}

section{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px}
.w{overflow-x:auto}

select{height:26px;padding:2px 8px}

.line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}

td select{height:26px}
.cntgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 16px}.autobtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.autobtn{display:flex;align-items:center;justify-content:center;height:44px;padding:4px 6px;background:var(--sub);color:var(--mu);border:1px solid var(--bd);border-radius:8px;font-size:13px;line-height:1.3;text-align:center;cursor:pointer}.autobtn.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}.info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;min-width:18px;padding:0;border-radius:50%;background:var(--sub);border:1px solid var(--bd);color:var(--mu);font-size:12px;font-weight:600;cursor:help;vertical-align:middle;flex:none;margin-left:4px}.info .tip{display:none;position:absolute;left:0;bottom:24px;z-index:999;width:280px;max-width:82vw;max-height:60vh;overflow-y:auto;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.6;color:var(--fg);box-shadow:0 4px 16px rgba(0,0,0,.2);white-space:normal;text-align:left;font-weight:400}.info:hover .tip,.info:focus .tip{display:block}.info.below .tip{top:24px;bottom:auto}.autogrid label{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}@media(max-width:560px){.cntgrid,.initgrid{grid-template-columns:1fr}.initgrid{grid-template-columns:repeat(3,1fr)}}

<div id="p-owned"><details class="fold"><summary>登録内容の保存・読み込み <button type="button" class="info" aria-label="注釈">i<span class="tip">所持サポカ登録の内容をブラウザまたはJSON形式で保存、読み込みできます。</span></button></summary><section id="s8o"></section></details><details class="fold" open><summary id="owH">所持サポカ登録</summary><section id="s4b"></section></details></div>

function isPropTr(tr){
  if(tr=='dr'||tr=='ch'||tr=='de'||tr=='up'||tr=='de_men'||tr=='de_act'||tr=='up_men'||tr=='up_act'||tr=='ch_basic'||tr=='K'||tr=='Lc')return true;
  if(tr.startsWith('gf_'))return true;
  if(/^L[012][sn*]$/.test(tr))return true;
  return false;
}
function propTmp(tf,v,df,self){
  const p=(tf||'').split('|');if(p.length<3)return;const tr=p[1];
  if(!isPropTr(tr))return;
  const del=isNaN(v)||v<0||(df!=null&&v==+df);
  document.querySelectorAll('#tops .tmpf').forEach(inp=>{
    if(inp===self)return;
    const q=(inp.dataset.tf||'').split('|');if(q.length<3||q[1]!=tr)return;
    if(del){delete tmpFire[inp.dataset.tf];inp.value=self.value;}
    else{const nv=Math.floor(v);tmpFire[inp.dataset.tf]=nv;inp.value=nv;}
  });
}
