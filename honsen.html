 `<p class=hint>サポートカードを開くと選抜試験で発動済みのアビリティを指定できます。</p><div class=line><button id=capAll class=ghost>${allOpen?'すべて閉じる':'すべて開く'}</button></div><div class=fixgrid>${[0,1,2,3,4,5].map(i=>{const id=fx[i],c=id?DATA.cards.find(x=>x.id==id):null;if(!c)return `<div class=fixslot>未選択</div>`;const caps=capList(S,c);return `<details class=fixslot${openCaps.has(c.id)?' open':''}><summary data-capfold="${c.id}"><button class=xbtn data-unfix="${c.id}" title="固定を解除">×</button>${cimg(c)}<b>${c.n}${c.sp?'<span class=sptag>SP</span>':''}</b><span class=lbl>${RU(c.r)} ${AT[c.t]||'アシスト'} ${PN[c.p]} ${(S.owned[c.id]!=null?S.owned[c.id]:4)}凸</span></summary>${caps.length?`<div class=caplist>${caps.map(e=>{const used=usedOf(S,c.id,e.key,e.cap);return `<div class=caprow><span class=caplab>${trigLabel(e.tr)}：<span class='${['vo','da','vi'][e.a]}'>${AT[e.a]}+${e.v}</span></span><span class=lbl>上限${e.cap}回</span>${e.tr=='EV'?`<label><input type=checkbox data-used="${c.id}|${e.key}" data-cap=${e.cap}${used?' checked':''}> 発動済み</label>`:`<label>発動済み <input type=number class=capin data-used="${c.id}|${e.key}" data-cap=${e.cap} min=0 max=${e.cap} value=${used}></label>`}<span class=rem>残り ${e.cap-used}回</span></div>`}).join('')}</div>`:`<div class=caplist><div class=capnone>上限つき効果はありません</div></div>`}</details>`}).join('')}</div>${badFx?`<p class=warn>固定のうち ${badFx}枚 は現在のプランでは使えません。プラン一致またはフリーのカードを選んでください。</p>`:''}<div class=line><button id=clearFE class=ghost style="margin-left:auto">すべて解除</button></div>`;
 $('s4c').innerHTML=`<div class=line><input id=feQ type=search placeholder="カード名で検索" value="${feQ}"><select id=feR>${[['','レア度'],['R','R'],['Sr','SR'],['Ssr','SSR']].map(([val,lab])=>`<option value="${val}"${feR==val?' selected':''}>${lab}</option>`).join('')}</select><select id=feA>${[[-1,'属性'],[0,'Vo'],[1,'Da'],[2,'Vi'],[3,'アシスト']].map(([val,lab])=>`<option value="${val}"${feA==val?' selected':''}>${lab}</option>`).join('')}</select><select id=feP>${[[-1,'プラン'],[0,'フリー'],[1,'センス'],[2,'ロジック'],[3,'アノマリー']].map(([val,lab])=>`<option value="${val}"${feP==val?' selected':''}>${lab}</option>`).join('')}</select></div><div id=feList></div>`;
 renderFE();}

const AN={L:'公開レッスン',K:'授業',O:'おでかけ',C:'相談',G:'差し入れ',S:'特別指導',R:'休む',E:'試験'};
const starVal=()=>Math.max(0,Math.min(1335,S.star||0));
const fcc=(k,n,note,kind,mx)=>`<div class=cnt><div class=ct><b>${n}</b>${note?`<small>${note}</small>`:''}<span class=kind>${kind}</span></div>${num('finCnt.'+k,0,mx)}</div>`;
function buildFin(){const e=$('sFinSch');if(!e)return;
 e.innerHTML=`<div class=w><table><tr><th>日</th><th>行動</th><th>メイン</th><th>サブ</th><th>SP</th></tr>${SCH.map((r,i)=>{if(i<20)return'';const j=i-20,L=r.o[0]=='L',ops=[...r.o.replace('☆','').replace('○','').split('').map(x=>[x,AN[x]]),['R','休む']];const a=S.finSch[j].a;let sub='',spc='';if(L){sub=sel('finSch.'+j+'.s',AT.map((x,k)=>[k,x,['vo','da','vi'][k]]).filter(([k])=>k!=S.finSch[j].m),['vo','da','vi'][S.finSch[j].s]);spc=sel('finSch.'+j+'.sp',[['sp','SP'],['n','通常']])}return`<tr><td>${r.l}</td><td>${sel('finSch.'+j+'.a',ops)}</td><td>${'LKS'.includes(a)?sel('finSch.'+j+'.m',AT.map((x,k)=>[k,x,['vo','da','vi'][k]]),['vo','da','vi'][S.finSch[j].m]):''}</td><td>${L?sub:''}</td><td>${spc}</td></tr>`}).join('')}<tr><td>本戦</td><td colspan=4>R1→インターバル→R2：行動選択なし</td></tr></table></div><div class=line>スター性（最終・直接入力） ${num('star',0,1335)} <span class=lbl>/ 1335</span></div>`;
 const c=$('sFinCnt');if(c){c.innerHTML=`<h3>カード取得・交換</h3><div class=cntgrid>${fcc('get','交換以外のカード取得','イベント・Pアイテム・インターバルでの取得分も含む','合計',99)}${fcc('exch','スキルカード交換（相談）','相談で交換した本戦分のみ','合計',20)}${GFU.filter(([, ,pl])=>!pl||pl===S.plan).map(([k,n])=>fcc(k,n,'','内訳',99)).join('')}</div><h3>強化・削除</h3><div class=cntgrid>${fcc('up','スキルカード強化','相談・インターバル・イベント等の全回数','合計',30)}${fcc('upMen','うち メンタル強化','','内訳',30)}${fcc('upAct','うち アクティブ強化','','内訳',30)}${fcc('de','スキルカード削除','相談・イベント等の全回数','合計',30)}${fcc('deMen','うち メンタル削除','','内訳',30)}${fcc('deAct','うち アクティブ削除','','内訳',30)}</div><h3>チェンジ・カスタム</h3><div class=cntgrid>${fcc('ch','チェンジ','イベント・Pアイテム分も含む','合計',10)}${fcc('cu','カスタム','','合計',10)}</div><h3>Pドリンク・Pアイテム</h3><div class=cntgrid>${fcc('bdC','Pドリンク交換（相談）','','合計',30)}${fcc('drOther','Pドリンク取得（その他）','主にPアイテム・インターバル分。お出かけ・差し入れ分は自動加算','合計',30)}${fcc('itOther','Pアイテム取得','サポートイベント分を含む','合計',30)}</div><span id=finCntWarn class=warn></span>`}
}
function showTopFinal(){const sv=starVal();const eb=$('evalBar');if(!eb)return;if(!tops.length){eb.innerHTML='<span class=lbl>評価値</span> <span class=evnum>—</span>';return}const t0=tops[topSel]||tops[0],f0=simFinal(S,t0.cs),ev=evalV(f0.par,sv);eb.innerHTML='<span class=lbl>評価値</span> <span class=evnum>'+ev+'</span> <span class=pill>'+grade(ev)[1]+'</span> <span class=evstats>'+[0,1,2].map(k=>'<span class="'+['vo','da','vi'][k]+'">'+AT[k]+' '+f0.p[k]+'</span>').join(' ')+' <span>合計 '+f0.par+'</span> <span>スター性 '+sv+'</span></span>'}
function build(){
 $('s1').innerHTML=`<div class=fields><label>プラン ${sel('plan',[[1,'センス'],[2,'ロジック'],[3,'アノマリー']])}</label></div><div class=initgrid>${AT.map((a,i)=>{const c=['vo','da','vi'][i];return`<div class=initcard><div class='${c}'>${a} ステータス</div>${bignum('sel.'+i,0,3000,1)}<div class='b ${c}'>パラメータボーナス</div>${bignum('pb.'+i,0,null,'0.1',1,'text')}<span class=lbl>％</span></div>`}).join('')}</div>`;
 buildForm();out();}
function out(){ const fx=(S.fixed||[]).map(id=>DATA.cards.find(c=>c.id==id)).filter(Boolean);if(fx.length>=6){tops=[{cs:fx.slice(0,6),v:simFinal(S,fx.slice(0,6)).v}];topSel=0}else{tops=[]} const cw=$('finCntWarn');if(cw){const C=S.finCnt||{},acq=(C.get||0)+(C.exch||0),ws=[];GFU.filter(([, ,pl])=>!pl||pl===S.plan).forEach(([k,n])=>{if((C[k]||0)>acq)ws.push(n+'が合計（'+acq+'）を超えています')});if((C.upMen||0)>(C.up||0))ws.push('うち メンタル強化が合計を超えています');if((C.upAct||0)>(C.up||0))ws.push('うち アクティブ強化が合計を超えています');if((C.deMen||0)>(C.de||0))ws.push('うち メンタル削除が合計を超えています');if((C.deAct||0)>(C.de||0))ws.push('うち アクティブ削除が合計を超えています');cw.textContent=ws.length?'警告: '+ws.join('／')+'（合計の回数に切り捨てて計算します）':''}
 showTopFinal()}
document.addEventListener('input',ev=>{const t=ev.target,k=t.dataset.k;
 if(t.id=='feQ'){feQ=t.value;feN=20;renderFE();return}
 if(t.dataset.used){const [cid,key]=t.dataset.used.split('|');const cap=+(t.dataset.cap||t.max||0);const n=t.type=='checkbox'?(t.checked?1:0):Math.max(0,Math.min(cap,+t.value||0));if(!S.used)S.used={};if(!S.used[cid])S.used[cid]={};S.used[cid][key]=n;const row=t.closest&&t.closest('.caprow');if(row){const rem=row.querySelector('.rem');if(rem)rem.textContent='残り '+(cap-n)+'回'}save();out();return}
 if(k){let v=t.type=='number'?+t.value:(isNaN(t.value)||t.value===''?t.value:+t.value);v=normSP(k,v);if(/^sel\.\d+$/.test(k)){if(t.value!==''&&!/\.$/.test(t.value)&&String(v)!==t.value)t.value=String(v)}else if(/^pb\.\d+$/.test(k)){const raw=+t.value;if(t.value!==''&&!isNaN(raw)&&Math.abs(raw-v)>1e-9)t.value=v.toFixed(1)}sp(k,v);if(/^finSch\.\d+\.m$/.test(k)){const jj=+k.split('.')[1];if(S.finSch[jj].s==S.finSch[jj].m)S.finSch[jj].s=(S.finSch[jj].m+1)%3}if(/^finSch\.\d+\.(a|m|s)$/.test(k)){const y=scrollY;buildFin();scrollTo(0,y)}save();out()}});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.id=='feR'){feR=t.value;feN=20;renderFE();return}
 if(t.id=='feA'){feA=+t.value;feN=20;renderFE();return}
 if(t.id=='feP'){feP=+t.value;feN=20;renderFE();return}
 if(t.dataset.ow){const v=t.value;if(v==='')delete S.owned[t.dataset.ow];else S.owned[t.dataset.ow]=+v;save();buildForm();out();return}
 if(t.dataset.k&&(/^sel\.\d+$/.test(t.dataset.k)||/^pb\.\d+$/.test(t.dataset.k))){const v=normSP(t.dataset.k,+t.value);t.value=/^pb\.\d+$/.test(t.dataset.k)?v.toFixed(1):String(v);sp(t.dataset.k,v);save();out();return}
 if(t.dataset.k=='plan'){buildForm();out()}});
document.addEventListener('click',ev=>{const t=ev.target;
 if(t.dataset&&t.dataset.ftab){curTab=t.dataset.ftab;document.querySelectorAll('#tabs .tabbtn').forEach(b=>b.classList.toggle('on',b.dataset.ftab==curTab));$('p-sel').style.display=curTab=='sel'?'':'none';$('p-form').style.display=curTab=='sel'?'':'none';$('p-fin').style.display=curTab=='fin'?'':'none';if(curTab=='fin'){buildFin();out()}return}
 if(t.dataset.fix){const id=t.dataset.fix;S.fixed=S.fixed||[];const i=S.fixed.indexOf(id);if(i>=0)S.fixed.splice(i,1);else{if(S.fixed.length>=6){barMsg('固定は6枚までです');return}S.fixed.push(id)}buildForm();save();out();return}
 if(t.dataset.unfix){S.fixed=(S.fixed||[]).filter(x=>x!=t.dataset.unfix);buildForm();save();out();return}
 const cf=t.closest&&t.closest('[data-capfold]');if(cf){const id=cf.dataset.capfold;if(openCaps.has(id))openCaps.delete(id);else openCaps.add(id);return}
 if(t.id=='capAll'){const fx=S.fixed||[];const allOpen=fx.length>0&&fx.every(id=>openCaps.has(id));if(allOpen)fx.forEach(id=>openCaps.delete(id));else fx.forEach(id=>openCaps.add(id));buildForm();return}
 if(t.id=='clearFE'){S.fixed=[];buildForm();save();out();return}
 if(t.id=='feMore'){feN+=20;renderFE();return}});
build();out();

</script></body></html>
